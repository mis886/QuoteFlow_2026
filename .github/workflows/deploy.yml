name: Build and deploy (manual only — do not use)

# 2026-10-13: the `push` trigger was REMOVED. This workflow used to run
# `wrangler deploy` on every push to main, which showed up in the Cloudflare
# dashboard as "Manually deployed · Wrangler · by mis" next to Cloudflare's
# own build of the same commit — two deployers racing each other.
# The live site is now deployed ONLY by Cloudflare's own build from GitHub
# main (Workers Builds). Nothing starts this workflow by itself any more; it
# can only be started by hand from the Actions tab, and should not be.
on:
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
